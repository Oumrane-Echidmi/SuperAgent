server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Flutter's compiled JS contains non-ASCII text; declare UTF-8 explicitly.
  charset utf-8;
  charset_types text/plain text/css text/xml application/javascript text/javascript application/json;

  location /v1/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_redirect off;
    proxy_read_timeout 25s;
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
