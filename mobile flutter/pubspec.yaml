name: superagent
description: SuperAgent mobile (Flutter port of the aiagent.app demo website + COD Phase 1 flow).
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_web_auth_2: 5.1.0
  http: ^1.6.0
  timezone: ^0.11.2
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/fonts/Inter-LICENSE.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/ibm-plex-mono-400.ttf
        - asset: assets/fonts/ibm-plex-mono-700.ttf
          weight: 700
