services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: superagent_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: superagent
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superagent_admin -d superagent"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
